subject:
  agent: claude-code
  model: claude-sonnet-5-5
  flags: [--effort, high, --setting-sources, user, --strict-mcp-config, --no-session-persistence]

grader:
  command: [python3, ./../shared/grade.py]

judges:
  - kind: pairwise
    metric: quality-fable-judge
    agent: claude-code
    model: claude-fable-5-2
    flags: [--effort, medium, --setting-sources, "", --disable-slash-commands, --strict-mcp-config, --no-session-persistence]
    include: ["judge-view/raw/**/*.py"]
    rubric: |
      Both entries solve the same programming exercise. Decide which solution is easier to read, to understand, and to change.
      Ignore whether the solution is correct. Ignore length by itself and style details such as blank lines.
      Use these claims as a guide. For each entry, decide if each claim is true.
      1. Every function, class, and variable name says what it does or holds.
      2. Each function does one thing at one level of abstraction.
      3. Rules of the exercise appear as named functions or named constants, not as unexplained arithmetic.
      4. No control flow is nested deeper than two levels.
      5. No logic is duplicated.
      6. Edge cases and errors are handled in named steps, not in scattered conditionals.
      7. There is no dead code and no unused parameter.

repeats: 1
maxRuns: 100
maxJudgeCalls: 100
timeoutSeconds: 1800
inputs: [../shared]
passEnv: [CLAUDE_CODE_OAUTH_TOKEN]
