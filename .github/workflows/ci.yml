name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_FORCE: ${{ github.event_name != 'pull_request' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: bun install --frozen-lockfile
      - name: Install pytest for the example graders
        run: |
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install --quiet pytest==9.2.0
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip
      - run: bun run test
      - run: bun run stage
      - run: npm pack --dry-run ./packages/cli/out/package

  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the action on the quick start results
        id: verdict
        uses: ./
        with:
          results: examples/quick-start/runs.jsonl
          baseline: without-skill
          comment: "false"
          version: 0.2.0
      - name: Check the verdict
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          if [ "$VERDICT" != "better" ]; then
            echo "the action gave the verdict '$VERDICT', expected 'better'" >&2
            exit 1
          fi
